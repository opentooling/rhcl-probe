[project]
name = "rhcl-probe"
description = "Tests a Red Hat Connectivity Link API gateway and an OpenShift Service Mesh end to end"
license = "MIT"
requires-python = ">=3.13"
dynamic = ["version"]
# Pinned, with hashes, in requirements.txt: that is what the image installs.
dependencies = ["aiohttp>=3.14", "cryptography>=46"]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.17"]

[project.scripts]
rhcl-probe = "rhcl_probe.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rhcl_probe", "rhcl_probe.checks", "rhcl_probe.console"]

[tool.setuptools.package-data]
"rhcl_probe.console" = ["web/*"]

[tool.setuptools.dynamic]
version = { attr = "rhcl_probe.__version__" }

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "BLE", "RUF"]
# E501: the formatter keeps code within line-length; long messages stay on one line to stay greppable.
# ASYNC230: the only files read are small mounted Secrets.
ignore = ["E501", "ASYNC230", "RUF001"]  # RUF001: "×" and "→" in details are meant

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]
